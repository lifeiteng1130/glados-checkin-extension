<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>GLaDOS 自动签到</title><main><h1>GLaDOS 自动签到</h1><section class="card" aria-live="polite"><div><span>今日状态</span><strong id="state">读取中…</strong></div><p id="message">正在读取状态。</p><div><span>最近执行</span><time id="last-run">—</time></div><div><span>下次执行</span><time id="next-run">—</time></div></section><button id="check-now" class="primary">立即签到</button><button id="open-page">打开签到页面</button><button id="open-settings">签到设置</button><form id="schedule-form" hidden><label class="enable"><input id="enabled" type="checkbox">启用自动签到</label><fieldset><legend>签到方式</legend><label><input id="mode-fixed" name="mode" type="radio" value="fixed">固定时间</label><label><input id="mode-random" name="mode" type="radio" value="random">当天随机时间</label></fieldset><label id="fixed-row">固定时间<input id="fixed-time" type="time" required></label><div id="random-row"><label>开始时间<input id="random-start" type="time" required></label><label>结束时间<input id="random-end" type="time" required></label><small>范围仅限当天，不能跨午夜。</small></div><label>失败重试间隔（分钟）<input id="retry-minutes" type="number" min="1" step="1" required></label><p id="feedback" role="status"></p><button class="primary" type="submit">保存设置</button></form></main><script type="module" src="popup.js"></script>
